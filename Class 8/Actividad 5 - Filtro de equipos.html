<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica 05 — Filtro de equipos</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        border: 2px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        margin-bottom: 1rem;
      }

      input:focus {
        outline: none;
        border-color: #4a90e2;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        padding: 0.5rem 0.25rem;
        border-bottom: 1px solid #eee;
        font-size: 1rem;
      }

      #sin-resultados {
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Equipos del Mundial 2026</h1>

    <input id="buscador" type="text" placeholder="Buscar equipo..." />

    <ul id="lista">
      <li>Argentina</li>
      <li>Brasil</li>
      <li>Francia</li>
      <li>Alemania</li>
      <li>España</li>
      <li>Portugal</li>
      <li>Marruecos</li>
      <li>Japon</li>
    </ul>

    <p id="sin-resultados" style="display: none">No se encontraron equipos.</p>

    <script>
      const input = document.getElementById ("buscador");
      const list = document.getElementById ("lista");
      const li = list.querySelectorAll("li");
      const sinResultados = document.getElementById("sin-resultados");
      let counter = 0;
      input.addEventListener("input", () => {
      let counter = 0 //variable que cuenta la cantidad de items que no coinciden con la busqueda
      let newInput = input.value.toLowerCase(); //guarda el input en una variable aparte para simplificar la declaracion if
      li.forEach(element => { //por cada elemento de li
        //console.log (element.innerText)
        if(element.innerText.toLowerCase().includes(newInput)){ //si el elemento tiene caracteres que coinciden con los de la busqueda
          element.style.display = ""
        } else {
          element.style.display = "none"
          counter++; //contador para la cantidad de elementos que no coinciden con la busqueda
        }
        if (counter===li.length){ //si la cantidad de elementos que no coinciden con la busqueda es la misma que los elementos que existen, es true
          sinResultados.style.display = "block";
        } else { //si hay mas elementos siendo mostrados que elementos totales, no se muestra el sin resultados
          sinResultados.style.display = "none";
        }

      });
          });
      // TODO: completar este bloque
      //
      // 1. Seleccioná el input#buscador y agregale un listener para el evento "input"
      // 2. En el handler, leé el valor del input con .value.toLowerCase()
      // 3. Recorré todos los <li> con querySelectorAll("li") + forEach:
      //    - Si el textContent del <li> incluye el texto buscado → style.display = ""
      //    - Si no → style.display = "none"
      // 4. Contá cuántos <li> quedaron visibles. Si ninguno, mostrá #sin-resultados.
      //    Si hay al menos uno, asegurate de ocultar #sin-resultados.
    </script>
  </body>
</html>
